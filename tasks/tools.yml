---
- name: Install CLI tools from apt
  ansible.builtin.apt:
    name:
      - fzf
      - tldr
      - bat
      - ripgrep
      - htop
      - magic-wormhole
    state: present
  become: true

# Debian and Ubuntu ship bat as "batcat" to avoid a name clash.
- name: Link bat to batcat
  ansible.builtin.file:
    src: /usr/bin/batcat
    dest: "{{ target_home }}/.local/bin/bat"
    state: link
  failed_when: false
  when: ansible_distribution in ['Ubuntu', 'Debian']

- name: Check the installed LazyGit version
  ansible.builtin.command: /usr/local/bin/lazygit --version
  register: lazygit_installed
  changed_when: false
  failed_when: false

- name: Install LazyGit
  ansible.builtin.unarchive:
    src: "https://github.com/jesseduffield/lazygit/releases/download/v{{ lazygit_version }}/lazygit_{{ lazygit_version }}_linux_{{ lazygit_arch }}.tar.gz"
    dest: /usr/local/bin
    include: lazygit
    remote_src: true
  become: true
  when: "'version=' + lazygit_version not in lazygit_installed.stdout"

- name: Install Docker prerequisites
  ansible.builtin.apt:
    name:
      - ca-certificates
      - curl
    state: present
  become: true
  tags: docker

- name: Create the apt keyrings directory
  ansible.builtin.file:
    path: /etc/apt/keyrings
    state: directory
    mode: "0755"
  become: true
  tags: docker

- name: Add the Docker apt signing key
  ansible.builtin.get_url:
    url: "https://download.docker.com/linux/{{ ansible_distribution | lower }}/gpg"
    dest: /etc/apt/keyrings/docker.asc
    mode: "0644"
  become: true
  tags: docker

- name: Add the Docker apt repository
  ansible.builtin.apt_repository:
    repo: >-
      deb [arch={{ dpkg_arch }} signed-by=/etc/apt/keyrings/docker.asc]
      https://download.docker.com/linux/{{ ansible_distribution | lower }}
      {{ ansible_distribution_release }} stable
    filename: docker
    state: present
  become: true
  tags: docker

- name: Install Docker Engine
  ansible.builtin.apt:
    name:
      - docker-ce
      - docker-ce-cli
      - containerd.io
      - docker-buildx-plugin
      - docker-compose-plugin
    state: present
    update_cache: true
  become: true
  tags: docker

- name: Allow the user to run Docker without sudo
  ansible.builtin.user:
    name: "{{ target_user }}"
    groups: docker
    append: true
  become: true
  tags: docker
